name: Build Windows pre-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build Windows executable
        shell: powershell
        run: |
          pnpm build:exe
          Copy-Item dist\lan-browser.exe dist\LanBrowser.exe
          Compress-Archive -Path dist\LanBrowser.exe,dist\lan-browser.config.json -DestinationPath dist\LanBrowser-windows-x64.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LanBrowser-windows-x64
          path: |
            dist/LanBrowser.exe
            dist/lan-browser.config.json
            dist/LanBrowser-windows-x64.zip

      - name: Publish GitHub pre-release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "LanBrowser ${{ github.ref_name }}" --prerelease --generate-notes dist/LanBrowser.exe dist/lan-browser.config.json dist/LanBrowser-windows-x64.zip
